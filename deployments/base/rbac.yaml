apiVersion: v1
kind: ServiceAccount
metadata:
  name: dra-driver-ovsdpdk
  namespace: dra-driver-ovsdpdk
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dra-driver-ovsdpdk
rules:
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceslices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims/driver"]
    resourceNames: ["ovsdpdk.k8snetworkplumbingwg.io"]
    verbs: ["associated-node:update", "associated-node:patch"]
  - apiGroups: ["ovsdpdk.k8snetworkplumbingwg.io"]
    resources: ["ovsdpdkconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dra-driver-ovsdpdk
  namespace: dra-driver-ovsdpdk
rules:
  - apiGroups: ["ovsdpdk.k8snetworkplumbingwg.io"]
    resources: ["ovsdpdkresourcepolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dra-driver-ovsdpdk
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dra-driver-ovsdpdk
subjects:
  - kind: ServiceAccount
    name: dra-driver-ovsdpdk
    namespace: dra-driver-ovsdpdk
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dra-driver-ovsdpdk
  namespace: dra-driver-ovsdpdk
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dra-driver-ovsdpdk
subjects:
  - kind: ServiceAccount
    name: dra-driver-ovsdpdk
    namespace: dra-driver-ovsdpdk
