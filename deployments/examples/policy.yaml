# Example OvsDpdkResourcePolicy.
#
# This policy advertises two OVS-DPDK bridges (br-dpdk0, br-dpdk1) on worker
# nodes.  Adjust the nodeSelector and bridge names to match your environment.
apiVersion: ovsdpdk.k8snetworkplumbingwg.io/v1alpha1
kind: OvsDpdkResourcePolicy
metadata:
  name: example-policy
  namespace: dra-driver-ovsdpdk
spec:
  # nodeSelector restricts which nodes this policy applies to.
  # Remove the field entirely to apply to all nodes.
  nodeSelector:
    nodeSelectorTerms:
      - matchExpressions:
          - key: node-role.kubernetes.io/worker
            operator: Exists
  bridges:
    - name: br-dpdk0
    - name: br-dpdk1
