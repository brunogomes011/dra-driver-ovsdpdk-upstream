name: PR Welcome Comment

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on new PR
        uses: actions/github-script@v7
        with:
          script: |
            const message = `👋 Thank you for your contribution!

            **To run E2E tests**, a maintainer with write access must comment:
            \`\`\`
            /ok-to-test
            \`\`\`

            This will trigger the full E2E test suite including Tier 1 and Tier 2 tests.

            **Note:** All commits must be signed with DCO. Use \`git commit -s\` to sign your commits.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
