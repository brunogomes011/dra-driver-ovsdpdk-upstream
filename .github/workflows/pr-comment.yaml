name: PR Welcome Comment

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on new PR
        uses: actions/github-script@v7
        with:
          script: |
            const message = `👋 Thank you for your contribution!

            **To run all tests and checks**, a maintainer with write access must comment:
            \`\`\`
            /ok-to-test
            \`\`\`

            This will trigger:
            - **DCO Check** - Verifies all commits are signed
            - **CI Basic Checks** - Runs vet, unit tests, and verify generated files
            - **E2E Tests Tier 1** - Integration tests
            - **E2E Tests Tier 2** - Advanced integration tests

            **Note:** All commits must be signed with DCO. Use \`git commit -s\` to sign your commits.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
